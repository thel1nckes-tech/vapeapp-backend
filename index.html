<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MOGVAPE</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/style.css?v=1790424529">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4ea1ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MOGVAPE">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
    <div id="app">
        <header class="top-bar">
<button class="city-picker" onclick="showPickup(true)">
    <span id="city-label">📍 Выберите точку</span>
    <span class="city-picker-arrow">▾</span>
</button>
            <span class="logo">MOGVAPE</span>
        </header>

        <main id="content">
            <!-- Сюда рендерится контент через JS -->
        </main>

        <nav class="bottom-nav">
            <button data-tab="catalog" class="nav-btn active">
                <span class="nav-ico">🛍</span><small>Ассортимент</small>
            </button>
            <button data-tab="cart" class="nav-btn">
                <span class="nav-ico-wrap"><span class="nav-ico">🛒</span><span class="nav-badge" id="cart-badge" style="display:none">0</span></span><small>Корзина</small>
            </button>
            <button data-tab="favorites" class="nav-btn">
                <span class="nav-ico">❤️</span><small>Избранное</small>
            </button>
            <button data-tab="profile" class="nav-btn">
                <span class="nav-ico">👤</span><small>Профиль</small>
            </button>
        </nav>
    </div>

    <!-- Модальное окно настроек -->
<div id="settings-modal" class="modal-overlay" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:999;align-items:center;justify-content:center;padding:20px;">
    <div class="modal-content" style="background:var(--card);color:var(--text);width:100%;max-width:440px;border-radius:28px;padding:24px 20px;box-shadow:0 25px 70px rgba(0,0,0,0.5);max-height:88vh;overflow-y:auto;position:relative;">
        <div class="modal-header">
            <h2>Настройки</h2>
            <button class="modal-close" onclick="closeSettings()">✕</button>
        </div>

        <div class="modal-section">
            <div class="modal-label">ТЕМА ОФОРМЛЕНИЯ</div>
            <div class="theme-switch">
                <button id="theme-light" class="theme-btn" onclick="setTheme('light')">
                    <span class="theme-icon">☀️</span>
                    <span>Светлая</span>
                </button>
                <button id="theme-dark" class="theme-btn active" onclick="setTheme('dark')">
                    <span class="theme-icon">🌙</span>
                    <span>Тёмная</span>
                </button>
            </div>
        </div>

        <div class="modal-section">
            <div class="modal-label">КОНТАКТНЫЕ ДАННЫЕ</div>
            <input class="promo-input" id="phone-input" type="tel" placeholder="Телефон (без +)" maxlength="11" inputmode="numeric">
            <input class="promo-input" id="email-input" type="email" placeholder="Email" style="margin-top:8px" inputmode="email" autocomplete="email">
            <button class="promo-btn" onclick="saveContacts()" style="margin-top:10px">Сохранить</button>
        </div>


    </div>
</div>

<script src="/app.js?v=1790422579"></script>
<script src="/variant.js?v=1790421814"></script>
<script>// SW временно отключён</script>
</body>
</html>
